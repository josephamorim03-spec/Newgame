<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaiju 2048 — Prototype</title>
<style>
:root{--bg:#101820;--panel:#18242b;--line:#34434a;--ink:#f1e7ce;--muted:#98a7a9;--hot:#ef6445;--mech:#e6ac4f;--kaiju:#db5a50;--cell:#223138}
*{box-sizing:border-box}body{margin:0;background:#091014;color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:520px;min-height:100svh;margin:auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(#102029,#0b1216)}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}h1{margin:0;font-size:27px;letter-spacing:-.04em}header small{color:var(--muted);font-weight:800}
.intent{border:1px solid #7a3c35;background:#241717;padding:9px 11px;margin-bottom:10px;display:flex;justify-content:space-between;font-weight:900}.intent b{color:#ff8168}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;aspect-ratio:1;border:2px solid #4b5c60;background:#0b1114;padding:6px;box-shadow:0 10px 25px #0008}
.cell{position:relative;border:1px solid #35474d;background:linear-gradient(145deg,#24363d,#17242a);border-radius:7px;display:grid;place-items:center;font-weight:1000;font-size:23px;overflow:hidden}
.cell.tile{color:#17130e;background:linear-gradient(145deg,#f0cf82,#8a6238);border-color:#c28d4d}
.cell.mech{background:linear-gradient(145deg,#f1ba53,#6a471e);color:#16110b}.cell.mech:after{content:"MECH";position:absolute;bottom:5px;font-size:7px;letter-spacing:.12em}
.cell.kaiju{background:linear-gradient(145deg,#a6443b,#40201e);color:#ffe1d4}.cell.kaiju:after{content:"KAIJU";position:absolute;bottom:5px;font-size:7px}
.tele{outline:3px solid #ef6445;outline-offset:-3px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px auto;width:210px}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(3){grid-column:2}.controls button:nth-child(4){grid-column:3}
button{border:1px solid #55646a;background:#18262c;color:#f3e8ce;border-radius:8px;padding:12px;font-weight:900;box-shadow:0 4px 0 #05090b}button:active{transform:translateY(3px);box-shadow:0 1px 0 #05090b}
.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.status div{background:#121c21;border:1px solid #304047;padding:8px;border-radius:7px}.status small{display:block;color:#829194;font-size:7px;letter-spacing:.1em}.status b{font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.card{text-align:left;min-height:78px;padding:9px;background:#1b272d}.card b{display:block;color:#f1c270}.card small{color:#99a6a8}.phase{text-align:center;color:#a99c83;font:800 9px monospace;letter-spacing:.1em;margin-top:13px}
</style></head><body><main>
<header><div><h1>KAIJU 2048</h1><small>protótipo do núcleo</small></div><small id="turn">TURNO 1</small></header>
<div class="intent"><span>INTENÇÃO · ARTILHEIRO</span><b>ATACA COLUNA 4</b></div>
<section class="board" id="board"></section>
<div class="controls"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
<div class="status"><div><small>REATOR</small><b id="hp">10/10</b></div><div><small>ENERGIA</small><b id="energy">3</b></div><div><small>FUSÕES</small><b id="merges">0</b></div></div>
<div class="cards"><button class="card" data-card="push"><b>EMPURRÃO · 1</b><small>empurra o Kaiju 1 casa</small></button><button class="card" data-card="spawn"><b>CRIAR 2 · 1</b><small>cria um bloco 2 vazio</small></button><button class="card" data-card="shield"><b>ESCUDO · 1</b><small>evita o próximo dano</small></button></div>
<div class="phase" id="phase">DESLIZE A GRADE · DEPOIS O KAIJU AGE</div>
</main>
<script>
const B=4,S={turn:1,hp:10,energy:3,merges:0,shield:0,phase:'input',cells:Array(16).fill(0)};
S.cells[0]=2;S.cells[1]=2;S.cells[5]='M';S.cells[15]='K';
const idx=(r,c)=>r*B+c;
function spawn(){let e=S.cells.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(!e.length)return;S.cells[e[Math.floor(Math.random()*e.length)]]=Math.random()<.8?2:4}
function render(){let b=document.querySelector('#board');b.innerHTML='';S.cells.forEach((v,i)=>{let d=document.createElement('div');d.className='cell';if(typeof v==='number'&&v)d.classList.add('tile');if(v==='M')d.classList.add('mech');if(v==='K')d.classList.add('kaiju');if(i%4===3)d.classList.add('tele');d.textContent=typeof v==='number'&&v?v:v==='M'?'◆':v==='K'?'▲':'';b.append(d)});hp.textContent=S.hp+'/10';energy.textContent=S.energy;merges.textContent=S.merges;turn.textContent='TURNO '+S.turn;phase.textContent=S.phase==='input'?'DESLIZE A GRADE · DEPOIS O KAIJU AGE':'RESOLVENDO...'}
function slide(dir){if(S.phase!=='input')return;let dr=dir==='down'?1:dir==='up'?-1:0,dc=dir==='right'?1:dir==='left'?-1:0;let order=[...Array(16).keys()].sort((a,b)=>dir==='right'||dir==='down'?b-a:a-b);let merged=new Set;for(const i of order){let v=S.cells[i];if(typeof v!=='number'||!v)continue;let r=Math.floor(i/4),c=i%4,cur=i;while(true){let nr=r+dr,nc=c+dc;if(nr<0||nr>=4||nc<0||nc>=4)break;let ni=idx(nr,nc),nv=S.cells[ni];if(nv===0){S.cells[ni]=S.cells[cur];S.cells[cur]=0;cur=ni;r=nr;c=nc;continue}if(nv===v&&!merged.has(ni)){S.cells[ni]=v*2;S.cells[cur]=0;merged.add(ni);S.merges++;S.energy=Math.min(6,S.energy+1)}break}}S.phase='enemy';render();setTimeout(enemy,250)}
function enemy(){let k=S.cells.indexOf('K');let col=k%4;if(col===3&&!S.shield)S.hp=Math.max(0,S.hp-2);S.shield=0;spawn();S.turn++;S.energy=Math.max(3,S.energy);S.phase='input';render()}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>slide(b.dataset.d));
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(S.phase!=='input'||S.energy<1)return;let c=b.dataset.card;if(c==='spawn'){spawn();S.energy--}else if(c==='shield'){S.shield=1;S.energy--}else if(c==='push'){let k=S.cells.indexOf('K'),r=Math.floor(k/4),cc=k%4;if(cc>0&&S.cells[k-1]===0){S.cells[k-1]='K';S.cells[k]=0;S.energy--}}render()});
render();
</script></body></html>

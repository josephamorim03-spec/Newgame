<title>Quadros do Caderno da Diana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* layout: uma coluna de folhas de gibi; cada quadro é arte + camada de tinta (balão, rabinho, onomatopeia, retícula) por cima */
:root {
  --papel: #fbf1df; --papel-2: #f1dfc2; --folha: #fffaf0; --tinta: #3a2a2e; --tinta-suave: #7a6468;
  --mel: #f2b15e; --rosa: #ec8fa8; --azul: #6fbfd3; --pendente: #b8761c; --recusada: #b2483a; --caneta: #8a2f3a;
  --nanquim: #3a2a2e;
  --f-titulo: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-texto: "Nunito", system-ui, sans-serif;
  --f-mao: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #1f2a25; --papel-2: #2b3a33; --folha: #2a2422; --tinta: #f1e6d6; --tinta-suave: #b9aa9c;
  --pendente: #f0b25c; --recusada: #f08a7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --papel: #1f2a25; --papel-2: #2b3a33; --folha: #2a2422; --tinta: #f1e6d6; --tinta-suave: #b9aa9c;
  --pendente: #f0b25c; --recusada: #f08a7a; color-scheme: dark }
body { background: var(--papel); color: var(--tinta); font-family: var(--f-texto); font-size: 15px; line-height: 1.5; }
.tudo { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 28px; }
header { display: grid; gap: 10px; }
h1 { font-family: var(--f-titulo); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.lide { margin: 0; max-width: 64ch; color: var(--tinta-suave); }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--tinta-suave); align-items: center; }
nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
nav a { flex: none; font: 600 13px var(--f-titulo); color: var(--tinta); text-decoration: none; padding: 5px 11px; border: 2px solid var(--tinta); border-radius: 999px; background: var(--folha); }
nav a:hover, nav a:focus-visible { background: var(--mel); color: #3a2a2e; outline: none; }
main { display: grid; gap: 28px; }
.folha { background: var(--folha); border: 3px solid var(--tinta); border-radius: 6px; padding: 14px; display: grid; gap: 12px; box-shadow: 6px 6px 0 rgba(58,42,46,.18); scroll-margin-top: 16px; }
.folha h2 { font-family: var(--f-titulo); font-weight: 600; font-size: 20px; margin: 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.folha h2 small { font: 700 11px var(--f-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.q { grid-column: span 2; display: grid; gap: 4px; min-width: 0; }
.q.q-meio { grid-column: span 1; }
@media (max-width: 560px) { .q.q-meio { grid-column: span 2; } }

/* o quadro em si (a arte, a tinta, os balões, o mural) está em css/quadros.css */
/*QUADROS_CSS*/
.q.q-meio .arte { aspect-ratio: 1 / 1; }
@media (max-width: 560px) { .q.q-meio .arte { aspect-ratio: 4 / 3; } }

/* o editor de balões (D.editor): arrastar o balão, a alça da largura, a bolinha da ponta do rabinho */
.editor .balao { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.editor .balao:hover, .editor .balao.ativo { outline: 2px dashed var(--azul); outline-offset: 4px; }
.editor .balao.ajustado::before { content: "ajustado"; position: absolute; left: 50%; top: -1.9em; transform: translateX(-50%); font: 800 9px var(--f-texto); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: #4e7d68; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.alca { position: absolute; right: -11px; top: 50%; width: 18px; height: 34px; margin-top: -17px; border-radius: 6px; background: var(--azul); border: 2px solid #3a2a2e; cursor: ew-resize; touch-action: none; }
.ponta { position: absolute; z-index: 5; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--rosa); border: 2.5px solid #3a2a2e; cursor: move; touch-action: none; box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
.ferramentas { position: absolute; z-index: 6; display: flex; gap: 4px; padding: 4px; background: #3a2a2e; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.ferramentas button { font: 700 13px var(--f-texto); color: #3a2a2e; background: #fbf1df; border: 0; border-radius: 7px; padding: 6px 9px; cursor: pointer; min-width: 34px; }
.ferramentas button:hover, .ferramentas button:focus-visible { background: var(--mel); outline: none; }
.barra-editor { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; background: var(--folha); border: 3px solid var(--tinta); border-radius: 10px; box-shadow: 4px 4px 0 rgba(58,42,46,.18); font-size: 13px; }
.barra-editor b { font-family: var(--f-titulo); font-size: 15px; }
.barra-editor .estado-salvo { margin-left: auto; font-weight: 700; color: var(--tinta-suave); }
.barra-editor .estado-salvo.ok { color: #4e7d68; } .barra-editor .estado-salvo.erro { color: var(--recusada); }

.rodape { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--tinta-suave); flex-wrap: wrap; }
.rodape code { font: 600 12px ui-monospace, Menlo, monospace; color: var(--tinta); }
.rodape .velha { font: 800 9px var(--f-texto); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave); border: 1.5px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .opcoes { grid-template-columns: 1fr; } }
.opcao { display: grid; gap: 4px; min-width: 0; align-content: start; }
.rotulo-op { font: 600 13px var(--f-titulo); }
footer { font-size: 13px; color: var(--tinta-suave); max-width: 64ch; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
</style>

<div class="tudo qh">
  <header>
    <h1>O Caderno da Diana, em quadros</h1>
    <p class="lide" id="lide"></p>
    <div class="legenda" id="legenda"></div>
  </header>
  <nav id="indice" aria-label="Páginas"></nav>
  <main id="paginas"></main>
  <footer>Para pedir outra versão de um quadro, cite o código embaixo dele (por exemplo <code>p-mesa</code>) e o que muda. As falas marcadas "em revisão" ainda esperam a sua decisão na página de falas.</footer>
</div>

<script>
const D = /*DADOS*/null;
// os ajustes de balão: posição (x, y), largura (w) e ponta do rabinho (tx, ty) em % do quadro; fs é a escala da letra
/*QUADROS_JS*/
const Q = QuadrosHistoria.criar(D, { aoDesenhar: el => { if (D.editor) Editor.alcas(el); } });
const { AJ, esc, trecho, painel, desenhar } = Q;

// o leiaute desta página: a folha, a grade (dois quadros de meio lado a lado) e o rodapé com o código da arte e da fala
function rodape(arte, t) {
  const a = D.artes[arte] || {};
  const velha = arte && D.imagens[arte] && !a.nova ? '<span class="velha">arte antiga</span>' : '';
  return `<div class="rodape"><span>${arte ? `<code>${esc(arte)}</code>${velha}` : ''}</span>${t ? `<span>${esc(t.codigo)}${t.tipo === 'mudo' ? ' · ' + esc(t.txt) : ''}</span>` : ''}</div>`;
}

const ehMeio = q => !!(q && q.plano && q.plano !== 'inteiro' && !q.opcoes);
function quadro(q, meio, chave) {
  if (q.opcoes) {
    const ops = q.opcoes.map(([arte, codigo], k) => {
      const t = trecho(codigo);
      return `<div class="opcao"><span class="rotulo-op">Opção ${'ab'[k]}</span>${painel(arte, q, t, `${chave}_o${k}`)}${rodape(arte, t)}</div>`;
    }).join('');
    return `<div class="q"><div class="opcoes">${ops}</div></div>`;
  }
  const t = q.fala ? trecho(q.fala, q.parte) : null;
  return `<div class="q${meio ? ' q-meio' : ''}${q.impacto ? ' q-impacto' : ''}" data-linhas='${q.linhas ? JSON.stringify(q.linhas) : ''}'>${painel(q.arte, q, t, chave)}${rodape(q.arte, t)}</div>`;
}
function grade(qs, pag) {
  const out = []; let i = 0;
  while (i < qs.length) {
    if (ehMeio(qs[i]) && ehMeio(qs[i + 1])) { out.push(quadro(qs[i], true, `${pag}_${i}`), quadro(qs[i + 1], true, `${pag}_${i + 1}`)); i += 2; }
    else { out.push(quadro(qs[i], false, `${pag}_${i}`)); i += 1; }
  }
  return out.join('');
}

// ---------- o editor de balões (só quando D.editor) ----------
// cada ajuste é um documento do banco da página (coleção "baloes", um por balão); o Claude lê de volta e grava no
// arte/historia.json. Sem o banco (fora do claude.ai), dá para ajustar mas nada fica salvo.
const Editor = {
  db: null, ativo: null, arrasto: null, pendentes: new Map(),
  arte: ch => document.querySelector(`.balao[data-chave="${ch}"]`)?.closest('.arte'),
  pct: (el, x, y) => { const r = el.getBoundingClientRect(); return [(x - r.left) / r.width * 100, (y - r.top) / r.height * 100]; },
  // o ajuste atual de um balão; sem ajuste, nasce da posição automática dele
  ajuste(bal) {
    const ch = bal.dataset.chave, el = bal.closest('.arte');
    if (!AJ[ch]) AJ[ch] = { x: bal.offsetLeft / el.clientWidth * 100, y: bal.offsetTop / el.clientHeight * 100, w: bal.offsetWidth / el.clientWidth * 100, fs: 1 };
    return AJ[ch];
  },
  alcas(el) {
    el.querySelectorAll('.alca, .ponta, .ferramentas').forEach(n => n.remove());
    for (const bal of el.querySelectorAll('.balao')) {
      bal.insertAdjacentHTML('beforeend', '<span class="alca" title="Arraste para mudar a largura"></span>');
      if (bal._ponta && !bal.classList.contains('t-caixa')) {
        el.insertAdjacentHTML('beforeend', `<span class="ponta" data-chave="${bal.dataset.chave}" title="Arraste a ponta do rabinho" style="left:${bal._ponta[0]}px;top:${bal._ponta[1]}px"></span>`);
      }
    }
    const bal = Editor.ativo && el.querySelector(`.balao[data-chave="${Editor.ativo}"]`);
    if (bal) {
      bal.classList.add('ativo');
      const x = Math.min(el.clientWidth - 260, Math.max(4, bal.offsetLeft)), y = bal.offsetTop + bal.offsetHeight + 10 > el.clientHeight - 44 ? Math.max(4, bal.offsetTop - 46) : bal.offsetTop + bal.offsetHeight + 10;
      el.insertAdjacentHTML('beforeend', `<div class="ferramentas" style="left:${x}px;top:${y}px">
        <button data-acao="menor" title="Letra menor">A−</button><button data-acao="maior" title="Letra maior">A+</button>
        <button data-acao="rabo" title="Mostrar ou esconder o rabinho">${AJ[Editor.ativo]?.semRabo ? 'Com rabinho' : 'Sem rabinho'}</button>
        <button data-acao="auto" title="Volta ao lugar automático">Automático</button></div>`);
    }
  },
  redesenhar(ch) { const el = Editor.arte(ch); if (el) desenhar(el); },
  marcar(ch) {                                          // salva quando a pessoa solta (uma escrita por balão de cada vez)
    const aj = AJ[ch];
    Editor.pendentes.set(ch, aj ? { ...aj } : null);
    Editor.esvaziar();
  },
  async esvaziar() {
    if (!Editor.db || Editor.salvando) { if (!Editor.db) Editor.estado('Sem conexão com o claude.ai: os ajustes não ficam salvos.', 'erro'); return; }
    Editor.salvando = true;
    while (Editor.pendentes.size) {
      const [ch, aj] = Editor.pendentes.entries().next().value;
      Editor.pendentes.delete(ch);
      Editor.estado('Salvando…');
      try {
        const ref = Editor.db.collection('baloes').doc(ch);
        if (aj) {
          const r = n => n == null ? null : Math.round(n * 10) / 10;
          await ref.set({ x: r(aj.x), y: r(aj.y), w: r(aj.w), fs: Math.round((aj.fs || 1) * 100) / 100, tx: r(aj.tx), ty: r(aj.ty), semRabo: !!aj.semRabo });
        } else await ref.delete();
        Editor.estado('Ajustes salvos', 'ok');
      } catch (e) {
        Editor.estado(e && e.code === 'resource_exhausted' ? 'Muitas mudanças seguidas: espere um pouco e mexa de novo.' : 'Não deu para salvar este ajuste. Tente de novo.', 'erro');
      }
    }
    Editor.salvando = false;
  },
  estado(txt, cls = '') { const e = document.getElementById('estadoSalvo'); if (e) { e.textContent = txt; e.className = 'estado-salvo ' + cls; } },
  ligar() {
    document.body.classList.add('editor');
    document.addEventListener('pointerdown', ev => {
      const ponta = ev.target.closest('.ponta'), alca = ev.target.closest('.alca'), bal = ev.target.closest('.balao'), bt = ev.target.closest('.ferramentas button');
      if (bt) return;
      if (!ponta && !bal) { if (Editor.ativo && !ev.target.closest('.ferramentas')) { const ch = Editor.ativo; Editor.ativo = null; document.querySelectorAll('.balao.ativo').forEach(b => b.classList.remove('ativo')); Editor.redesenhar(ch); } return; }
      ev.preventDefault();
      const ch = (ponta || bal).dataset.chave, el = (ponta || bal).closest('.arte');
      const b = el.querySelector(`.balao[data-chave="${ch}"]`), aj = Editor.ajuste(b);
      const [px, py] = Editor.pct(el, ev.clientX, ev.clientY);
      Editor.arrasto = { ch, el, tipo: ponta ? 'ponta' : alca ? 'largura' : 'mover', px, py, ini: { ...aj } };
      if (Editor.ativo !== ch) { document.querySelectorAll('.balao.ativo').forEach(x => x.classList.remove('ativo')); Editor.ativo = ch; }
      (ponta || bal).setPointerCapture?.(ev.pointerId);
    });
    document.addEventListener('pointermove', ev => {
      const a = Editor.arrasto; if (!a) return;
      const [px, py] = Editor.pct(a.el, ev.clientX, ev.clientY), aj = AJ[a.ch];
      if (a.tipo === 'mover') { aj.x = Math.max(0, Math.min(98, a.ini.x + px - a.px)); aj.y = Math.max(0, Math.min(96, a.ini.y + py - a.py)); }
      if (a.tipo === 'largura') aj.w = Math.max(12, Math.min(96 - aj.x, a.ini.w + px - a.px));
      if (a.tipo === 'ponta') { aj.tx = Math.max(0, Math.min(100, px)); aj.ty = Math.max(0, Math.min(100, py)); aj.semRabo = false; }
      desenhar(a.el);
    });
    const soltar = () => { const a = Editor.arrasto; if (!a) return; Editor.arrasto = null; Editor.marcar(a.ch); desenhar(a.el); };
    document.addEventListener('pointerup', soltar); document.addEventListener('pointercancel', soltar);
    document.addEventListener('click', ev => {
      const bt = ev.target.closest('.ferramentas button'); if (!bt || !Editor.ativo) return;
      const ch = Editor.ativo, b = document.querySelector(`.balao[data-chave="${ch}"]`);
      if (bt.dataset.acao === 'auto') { delete AJ[ch]; Editor.marcar(ch); }
      else {
        const aj = Editor.ajuste(b);
        if (bt.dataset.acao === 'maior') aj.fs = Math.min(1.8, (aj.fs || 1) + .1);
        if (bt.dataset.acao === 'menor') aj.fs = Math.max(.6, (aj.fs || 1) - .1);
        if (bt.dataset.acao === 'rabo') aj.semRabo = !aj.semRabo;
        Editor.marcar(ch);
      }
      Editor.redesenhar(ch);
    });
  },
  async conectar() {
    const db = window.claude && await window.claude.use('db');
    if (!db) { Editor.estado('Sem conexão com o claude.ai: dá para testar, mas os ajustes não ficam salvos.', 'erro'); return; }
    Editor.db = db;
    Editor.estado('Conectado: cada ajuste é salvo ao soltar.', 'ok');
    db.collection('baloes').onSnapshot(snap => {
      for (const mud of snap.docChanges()) {
        const ch = mud.doc.id;
        if (Editor.arrasto && Editor.arrasto.ch === ch) continue;
        if (Editor.pendentes.has(ch)) continue;
        if (mud.type === 'removed') delete AJ[ch];
        else { const d = mud.doc.data(); AJ[ch] = { ...d, tx: d.tx ?? undefined, ty: d.ty ?? undefined }; if (d.tx == null) { delete AJ[ch].tx; delete AJ[ch].ty; } }
        Editor.redesenhar(ch);
      }
    }, () => Editor.estado('A conexão caiu: recarregue a página para continuar salvando.', 'erro'));
  },
};

const piloto = D.paginas.every(p => p.piloto);
document.getElementById('lide').textContent = piloto
  ? 'Piloto da segunda versão. O nariz da Diana segue uma folha de modelo única. As receitas são desenhadas no papel do caderno, e o título e as notas são letra de mão. Os balões ficam sobre a arte, do tamanho da fala, apontando para quem fala. A retícula, o desencaixe azul e rosa e as onomatopeias são os do jogo. Os quadros marcados "arte antiga" ainda são da primeira versão: a API ficou sem crédito antes de refazê-los.'
  : 'Os rascunhos de arte do modo história, página por página, com as falas do roteiro por cima.';
const nArtes = new Set(D.paginas.flatMap(p => p.quadros.flatMap(q => q.opcoes ? q.opcoes.map(o => o[0]) : [q.arte])).filter(a => D.imagens[a]));
const novas = [...nArtes].filter(a => D.artes[a] && D.artes[a].nova).length;
document.getElementById('legenda').innerHTML = `<span><b>${D.paginas.length}</b> páginas</span><span><b>${novas}</b> artes novas</span><span><b>${nArtes.size - novas}</b> antigas</span><span><span class="estado">em revisão</span> fala que ainda espera a sua decisão</span>`;
document.getElementById('indice').innerHTML = D.paginas.map(p => `<a href="#${p.id}">${esc(p.titulo.split(' · ').slice(0, 2).join(' · '))}</a>`).join('');
document.getElementById('paginas').innerHTML = D.paginas.map(p => `
  <section class="folha" id="${p.id}"><h2>${esc(p.titulo)}<small>${p.quadros.length} quadros</small></h2>
  <div class="grade">${grade(p.quadros, p.id)}</div></section>`).join('');

if (D.editor) {
  document.querySelector('h1').textContent = 'Balões do Caderno da Diana';
  document.getElementById('lide').textContent = 'Arraste um balão para mudar o lugar. A alça azul muda a largura (o texto se rearruma sozinho). A bolinha rosa é a ponta do rabinho: arraste até quem fala. Tocando no balão aparecem A− e A+ para o tamanho da letra, o rabinho e "Automático", que desfaz o ajuste. Cada ajuste é salvo ao soltar e o Claude lê de volta para gravar nos quadros.';
  document.getElementById('legenda').insertAdjacentHTML('beforebegin', '<div class="barra-editor"><b>Modo de ajuste</b><span>Toque num balão para ver as opções.</span><span class="estado-salvo" id="estadoSalvo">Conectando…</span></div>');
  Editor.ligar(); Editor.conectar();
}
const todos = () => document.querySelectorAll('.arte[data-arte]').forEach(desenhar);
document.querySelectorAll('img.base').forEach(i => { if (!i.complete) i.addEventListener('load', () => desenhar(i.closest('.arte'))); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(todos);
todos();
let espera; addEventListener('resize', () => { clearTimeout(espera); espera = setTimeout(todos, 80); });
</script>

name: Build Netlify production package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build standalone
        run: npm run build
      - name: Prepare Netlify Drop package
        run: |
          rm -rf dist-netlify
          mkdir dist-netlify
          cp ring-break-standalone.html dist-netlify/index.html
          cp netlify.toml dist-netlify/netlify.toml
          printf "RING//BREAK production package\nCommit: %s\n" "$GITHUB_SHA" > dist-netlify/BUILD.txt
      - name: Upload Netlify package
        uses: actions/upload-artifact@v4
        with:
          name: ring-break-netlify-production
          path: dist-netlify/
          if-no-files-found: error
          compression-level: 9

      - name: Run engine tests
        run: |
          npm test
          node tests/balance.cjs

      - name: Prepare full project package
        run: |
          rm -rf dist-full
          mkdir -p dist-full/.github/workflows
          cp README.md favicon.svg index.html netlify.toml package.json ring-break-standalone.html server.cjs dist-full/
          cp -R src docs tests tools dist-full/
          cp .github/workflows/build-netlify-production.yml dist-full/.github/workflows/
          printf "RING//BREAK full project package\nCommit: %s\n" "$GITHUB_SHA" > dist-full/BUILD.txt

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: ring-break-full-project
          path: dist-full/
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

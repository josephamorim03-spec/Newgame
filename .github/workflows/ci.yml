name: KNOT checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build Netlify ZIP
        if: github.ref == 'refs/heads/main'
        run: zip -r KNOT-production.zip . -x '.git/*' 'KNOT-production.zip'
      - name: Upload production package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KNOT-production
          path: KNOT-production.zip
          if-no-files-found: error
          retention-days: 7

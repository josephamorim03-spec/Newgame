<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>KNOT — Run</title>
<link rel="stylesheet" href="run-base.css" />
<link rel="stylesheet" href="run-ui.css" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#f4eee4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="KNOT" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="gamefeel.css" /></head>
<body class="mode-run">
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">K</div><div class="wordmark"><h1>KNOT</h1><p>Run</p></div></div><div class="controls"><a class="iconbtn homebtn" href="index.html" aria-label="Início" title="Início"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#home"></use></svg></a><button class="iconbtn" id="musicBtn" type="button" aria-label="Música" aria-pressed="true" title="Música"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#music"></use></svg></button><button class="iconbtn" id="soundBtn" type="button" aria-label="Som" aria-pressed="true" title="Som"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#sound"></use></svg></button><button class="btn labbtn" id="labBtn" type="button" aria-label="Laboratório de seeds" title="Laboratório"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#settings"></use></svg><span>Lab</span></button><button class="btn strong" id="restartBtn" type="button"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#restart"></use></svg><span>Nova run</span></button></div></header>
<section class="board-shell"><div class="board-wrap" id="board"><div class="center-halo"></div><div class="playfield" id="playfield"><svg viewBox="0 0 1000 1000" aria-hidden="true"><g id="grid"></g><g id="loops"></g><g id="edges"></g><g id="junctions"></g><g id="pulses"></g></svg><div class="node-layer" id="nodes"></div></div><div class="fx-layer" id="fx"></div><div class="overlay-hud"><div class="hud-top"><div class="chip-row"><div class="chip" id="roundPill">Rodada 1/6</div><div class="chip" id="stitchPill">8 pontos de fio</div><div class="chip" id="targetInline">Alvo 1.700</div></div><div class="chip score">Pontos <b id="scoreEl">0</b></div></div><div class="hint" id="hint">Toque em qualquer ponto para começar.</div><div class="corner-actions"><button class="btn draft-resume" id="draftResume" type="button" hidden>Escolher Knot</button><button class="fab info" id="infoBtn" type="button" aria-label="Detalhes" title="Detalhes"><svg class="ui-icon" aria-hidden="true"><use href="ui-icons.svg#info"></use></svg></button></div><div class="bottom-bar"><div class="goal-stack"><div class="target-pill"><b id="constraintTitle">Primeira trama</b> <span id="constraintMini">Feche formas.</span></div><div class="goal-badges"><span class="goal-badge required" id="requiredGoal" hidden></span><span class="goal-badge optional" id="directiveGoal" hidden></span></div></div><div class="target-progress"><span id="meter"></span></div></div></div></div></section></div>
<div class="drawer" id="drawer"><button class="drawer-scrim" id="drawerScrim" type="button" aria-label="Fechar detalhes"></button><div class="drawer-sheet"><div class="drawer-handle" id="drawerToggle" role="button" tabindex="0" aria-expanded="false"><div class="drawer-title">Detalhes da rodada</div><div class="drawer-grab"></div><div class="drawer-title" id="drawerState">abrir</div></div><div class="drawer-body"><section class="drawer-panel"><h3 id="ruleTitle">Primeira trama</h3><div class="drawer-rule" id="constraintText"></div></section><section class="drawer-panel"><h3>Knots ativos</h3><div class="knot-list" id="knotList"></div></section><section class="drawer-panel"><h3>Estatísticas</h3><div class="stats"><div class="stat"><b id="loopsStat">0</b><small>Loops</small></div><div class="stat"><b id="crossStat">0</b><small>Crosses</small></div><div class="stat"><b id="echoStat">0</b><small>Echoes</small></div></div></section><section class="drawer-panel"><h3>Últimas jogadas</h3><div class="log" id="log"></div></section></div></div></div>
<div class="sheet-overlay hidden" id="sheetOverlay"><div class="sheet-backdrop"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Painel da run" tabindex="-1"></div></div>
<script src="knot-audio.js?v=ios-media-1"></script><script src="gamefeel.js"></script><script src="share.js"></script><script src="run-synergies.js"></script><script src="run-a.js"></script><script src="run-b.js"></script><script src="run-c.js"></script><script src="run-d.js"></script>
</body></html>
